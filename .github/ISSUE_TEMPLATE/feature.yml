name: Feature request
description: Propose work that fits the published roadmap
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options:
        - Post-v1 language adapter
        - GitLab or Bitbucket (same contract)
        - Docs or DX
        - Bugfix disguised as a feature
        - Later / unsure
