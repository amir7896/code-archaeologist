name: Good first issue
description: Small, scoped work for a new contributor
title: "[good first issue] "
labels: ["good first issue", "help wanted"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: One concrete change. Do not use this template for incremental analysis, hosted AI, or GitLab.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Likely files
    validations:
      required: true
  - type: checkboxes
    id: fit
    attributes:
      label: Fits v1
      options:
        - label: This does not invent incremental ingest, hosted AI, or a second analysis path
          required: true
